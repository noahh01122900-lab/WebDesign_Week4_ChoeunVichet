<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body{
        margin: 0;
        padding: 0;
        background: pink;
        display: flex;
        flex-direction: column;
      }
  
      .container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 1em;
        /* padding-left: 10em;
        padding-right: 10em; */
        padding-inline: 10em;

      }

      header,
      footer {
        background: grey;
        height: 100px;
        flex-shrink: 0;
      }

      main {
        
        flex: 1;
        background: grey;
      }
 
    </style>
  </head>
  <body>
    <div class="container">
      <header>Header</header>
      <main>Main</main>
      <footer>Footer</footer>
      </section>
    </div>
  </body>
</html>
